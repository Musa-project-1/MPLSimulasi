<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
    <defs>
        <linearGradient id="mplGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#E11D48" />
            <stop offset="60%" stop-color="#9B111E" />
            <stop offset="100%" stop-color="#4C050D" />
        </linearGradient>
        <linearGradient id="mplInner" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
            <stop offset="100%" stop-color="#FECDD3" stop-opacity="0.85" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#E11D48" flood-opacity="0.4" />
        </filter>
    </defs>
    <!-- Geometric Squircle Monogram Base -->
    <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#mplGrad)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" filter="url(#glow)" />
    <!-- Inner Geometric M Structure -->
    <path d="M12 34V14L24 25L36 14V34" stroke="url(#mplInner)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M24 25V35" stroke="#FECDD3" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 3" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
    <defs>
        <linearGradient id="mplGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#F43F5E" />
            <stop offset="45%" stop-color="#BE123C" />
            <stop offset="100%" stop-color="#4C0519" />
        </linearGradient>
        <linearGradient id="mplInner" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="100%" stop-color="#FFE4E6" />
        </linearGradient>
        <filter id="glow" x="-15%" y="-15%" width="130%" height="130%">
            <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#BE123C" flood-opacity="0.35" />
        </filter>
    </defs>
    <!-- Geometric Squircle Monogram Base -->
    <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#mplGrad)" stroke="rgba(255,255,255,0.22)" stroke-width="1.5" filter="url(#glow)" />
    <!-- Dynamic Esports Bevel Slice -->
    <path d="M6 38L38 6" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <!-- Inner Geometric M Structure -->
    <path d="M12 34V15L24 25.5L36 15V34" stroke="url(#mplInner)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Trophy Apex Dot -->
    <circle cx="24" cy="11.5" r="2" fill="#FFE4E6" />
</svg>
